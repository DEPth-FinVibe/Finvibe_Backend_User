spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/testdb
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            scope: profile, email

jwt:
  secret: ${JWT_SECRET:v6yB8eN2pL5fX9zW1qR4tG7hJ0kM3nB6v9yB8eN2pL5fX9zW1qR4tG7hJ0kM3nB6}
  issuer: ${JWT_ISSUER:finvibe-user}
  access-token-expiration: 3600000 # 1 hour
  refresh-token-expiration: 1209600000 # 14 days

app:
  oauth2:
    base-url: ${OAUTH_REDIRECT_URL:http://localhost:3000/oauth/callback}
